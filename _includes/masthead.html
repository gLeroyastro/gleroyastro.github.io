<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="gl-nav" aria-label="Main navigation">
      <a class="gl-nav__brand" href="{{ '/' | relative_url }}">{{ site.title | default: site.name | default: 'Gavin Leroy' }}</a>
      <div class="gl-nav__links" aria-label="Site sections">
        {% for link in site.data.navigation.main %}
          {% unless link.url == '/' %}
            <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
          {% endunless %}
        {% endfor %}
      </div>
    </nav>
  </div>
</div>
